  --on-primary: #ffffff;
  --teal: #1a3a3a;

  --lavender: #b8a4ed;
  --peach: #ffb084;
  --ochre: #e8b94a;

  --ring: 0 0 0 2px #f5f0e0, 0 0 0 4px #0a0a0a;
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1a1a; --raised: #1a2a2a; --ink: #fffaf0; --body: #d6d1c5; --muted: #aba79d; --line: #2b3d3d;
    --primary: #fffaf0; --on-primary: #0a0a0a; --teal: #245250;
    --device-shadow: 0 0 0 1px #2b3d3d, 0 1px 2px #00000066, 0 10px 32px #00000066;
    --ring: 0 0 0 2px #0a1a1a, 0 0 0 4px #fffaf0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1a1a; --raised: #1a2a2a; --ink: #fffaf0; --body: #d6d1c5; --muted: #aba79d; --line: #2b3d3d;
  --primary: #fffaf0; --on-primary: #0a0a0a; --teal: #245250;
  --device-shadow: 0 0 0 1px #2b3d3d, 0 1px 2px #00000066, 0 10px 32px #00000066;

  color-scheme: dark;
}

html { height: 100%; box-sizing: border-box; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); overflow: hidden; overscroll-behavior: none; }
[hidden] { display: none !important; }
button { font-family: inherit; }

.app { height: 100%; display: flex; flex-direction: column; overflow: hidden; }

/* header */
.bar { flex-shrink: 0; padding-block: 8px 2px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 0; }
.bar-in { width: 100%; max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.chip { flex-shrink: 0; font-size: 13px; line-height: 1.4; font-weight: 600; padding: 4px 10px; border-radius: 9999px; background: var(--raised); color: var(--ink); }
.chip[data-tone="teal"] { background: var(--teal); color: var(--on-teal); }
.chip[data-tone="lavender"] { background: var(--lavender); color: var(--on-brand); }
.chip[data-tone="peach"] { background: var(--peach); color: var(--on-brand); }
.chip[data-tone="ochre"] { background: var(--ochre); color: var(--on-brand); }

<script>
(function () {
  try { document.documentElement.lang = 'ko'; } catch (e) {}

  var META = [{"chip": "소개", "tone": "neutral", "title": "내일지도 화면 미리보기", "desc": "옆으로 넘겨서 화면 10개를 둘러보세요"}, {"chip": "시작", "tone": "neutral", "title": "01 시작하기", "desc": "앱 설치 없이 고용24 계정으로 바로 시작"}, {"chip": "① 대시보드", "tone": "teal", "title": "02 홈 · 진로 대시보드", "desc": "목표·달성률·역량·활동을 그래프로 한눈에"}, {"chip": "① 대시보드", "tone": "teal", "title": "03 역량 리포트", "desc": "지난 학기와 비교한 역량 변화 레이더"}, {"chip": "① 대시보드", "tone": "teal", "title": "04 재맞고 참여 현황", "desc": "신청 → 상담 → 프로그램 진행 상황"}, {"chip": "③ 로드맵", "tone": "peach", "title": "05 경력개발로드맵", "desc": "학기별 단기·중기·장기 목표 타임라인"}, {"chip": "③ 로드맵", "tone": "peach", "title": "06 로드맵 수정 · 이력", "desc": "바뀐 목표를 바로 고치고 버전 비교"}, {"chip": "④ 점검·알림", "tone": "ochre", "title": "07 학기 중간 점검", "desc": "학기 초·중·말 목표 체크와 다음 할 일"}, {"chip": "④ 점검·알림", "tone": "ochre", "title": "08 알림", "desc": "점검 기간·상담·프로그램 모집 알림"}, {"chip": "② 테마", "tone": "lavender", "title": "09 테마 꾸미기", "desc": "포인트 색과 홈 레이아웃을 취향대로"}, {"chip": "② 테마", "tone": "lavender", "title": "10 홈 · 다크 테마", "desc": "같은 정보를 다크·그래프형으로"}];

  var app = document.getElementById('app');
  var track = document.getElementById('track');
  var slides = Array.prototype.slice.call(track.querySelectorAll('.slide'));
  var N = slides.length;
  var chip = document.getElementById('chip');
  var title = document.getElementById('title');
  var desc = document.getElementById('desc');
  var counter = document.getElementById('counter');
  var meter = document.getElementById('meter');
  var prevBtn = document.getElementById('prev');
  var nextBtn = document.getElementById('next');
  var focusBtn = document.getElementById('focusBtn');
  var exitBtn = document.getElementById('exitBtn');

  var reduce = false;
  try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  var active = -1;
  var settleTimer = 0;
  var themeTimer = 0;
  var rafs = [];
  var stale = {};

  function render(i) {
    var host = slides[i].querySelector('.screen');
    var tpl = document.getElementById('tpl-' + i);
    if (!host || !tpl) return;
    host.textContent = '';
    host.appendChild(tpl.content.cloneNode(true));
  }

  /* theme screen demo */
  var THEMES = [
    ['핑크', '#ff4d8b', '#0a0a0a'],
    ['틸', '#1a3a3a', '#ffffff'],
    ['라벤더', '#b8a4ed', '#0a0a0a'],
    ['피치', '#ffb084', '#0a0a0a'],
    ['오커', '#e8b94a', '#0a0a0a']
  ];
  var LAYOUTS = ['카드형', '그래프형', '리스트형'];
  function each(root, sel, fn) { Array.prototype.forEach.call(root.querySelectorAll(sel), fn); }
  function applyTheme(root, step) {
    var ci = (2 + step) % THEMES.length;
    var li = Math.floor(step / 2) % LAYOUTS.length;
    each(root, '.pv-accent', function (el) { el.style.background = THEMES[ci][1]; el.style.color = THEMES[ci][2]; });
    each(root, '[data-layout]', function (el) {
      var on = Number(el.getAttribute('data-layout')) === li;
      if (el.hasAttribute('hidden') === on) el.toggleAttribute('hidden', !on);
    });
    var t = root.querySelector('.pv-theme'); if (t) t.textContent = THEMES[ci][0];
    var l = root.querySelector('.pv-layout-name'); if (l) l.textContent = LAYOUTS[li];
    each(root, '.sw', function (b) {
      var on = Number(b.getAttribute('data-i')) === ci;
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.style.boxShadow = on ? '0 0 0 2px #fffaf0, 0 0 0 4px #0a0a0a' : '0 0 0 0 transparent';
      var c = b.querySelector('.sw-check'); if (c) c.toggleAttribute('hidden', !on);
      var lab = b.parentNode.querySelector('.sw-label');
      if (lab) { lab.style.fontWeight = on ? '600' : '500'; lab.style.color = on ? '#0a0a0a' : '#6a6a6a'; }
    });
    each(root, '.lay', function (b) {
      var on = Number(b.getAttribute('data-i')) === li;
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.style.borderColor = on ? '#0a0a0a' : '#f5f0e0';
      var badge = b.querySelector('.lay-badge'); if (badge) badge.toggleAttribute('hidden', !on);
    });
  }

  function countUp(el) {
    var to = Number(el.getAttribute('data-to')) || 0;
    if (reduce) { el.textContent = String(to); return; }
    el.textContent = '0';
    var start = null, delay = 250, dur = 1400;
    function tick(t) {
      if (start === null) start = t;
      var p = Math.min(1, Math.max(0, (t - start - delay) / dur));
      el.textContent = String(Math.round(to * (1 - Math.pow(1 - p, 3))));
      if (p < 1) rafs.push(requestAnimationFrame(tick));
    }
    rafs.push(requestAnimationFrame(tick));
  }

  function stopExtras() {
    clearInterval(themeTimer); themeTimer = 0;
    rafs.forEach(function (id) { cancelAnimationFrame(id); }); rafs = [];
  }

  function startExtras(i) {
    var s = slides[i];
    each(s, '.count', countUp);
    var demo = s.querySelector('.theme-demo');
    if (demo && !reduce) {
      var step = 0;
      applyTheme(demo, 0);
      themeTimer = setInterval(function () { step = (step + 1) % 30; applyTheme(demo, step); }, 1800);
    }
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function updateChrome(i) {
    var m = META[i];
    chip.textContent = m.chip;
    chip.setAttribute('data-tone', m.tone);
    title.textContent = m.title;
    desc.textContent = m.desc;
    counter.textContent = i === 0 ? '표지' : pad(i) + ' / ' + pad(N - 1);
    meter.style.width = (i / (N - 1) * 100) + '%';
    prevBtn.disabled = i === 0;
    nextBtn.disabled = i === N - 1;
  }

  function setActive(i) {
    if (i === active) return;
    var prev = active;
    active = i;
    slides.forEach(function (s, k) {
      var on = k === i;
      s.classList.toggle('is-live', on);
      if (on) { s.removeAttribute('inert'); s.removeAttribute('aria-hidden'); }
      else { s.setAttribute('inert', ''); s.setAttribute('aria-hidden', 'true'); }
    });
    stopExtras();
    if (prev >= 0) stale[prev] = true;
    delete stale[i];
    updateChrome(i);
    startExtras(i);
  }

  function flush() {
    Object.keys(stale).forEach(function (k) {
      var n = Number(k);
      if (n !== active) render(n);
    });
    stale = {};
  }

  function indexNow() {
    var w = Math.max(1, track.clientWidth);
    return Math.max(0, Math.min(N - 1, Math.round(track.scrollLeft / w)));
  }

  function go(i) {
    i = Math.max(0, Math.min(N - 1, i));
    track.scrollTo({ left: i * track.clientWidth, behavior: reduce ? 'auto' : 'smooth' });
  }

  function fit() {
    var w = track.clientWidth, h = track.clientHeight;
    var cs = window.getComputedStyle(slides[0]);
    var padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    var padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    var s = Math.max(0.3, Math.min((w - padX) / 390, (h - padY) / 844, 1));
    document.documentElement.style.setProperty('--s', s.toFixed(4));
    if (active >= 0) track.scrollLeft = active * w;
  }

  function setFocus(on) {
    app.classList.toggle('focus', on);
    focusBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    exitBtn.toggleAttribute('hidden', !on);
    fit();
    try { (on ? exitBtn : focusBtn).focus({ preventScroll: true }); } catch (e) {}
  }

  for (var i = 0; i < N; i++) render(i);

  track.addEventListener('scroll', function () {
    setActive(indexNow());
    clearTimeout(settleTimer);
    settleTimer = setTimeout(flush, 220);
  }, { passive: true });

  prevBtn.addEventListener('click', function () { go(active - 1); });
  nextBtn.addEventListener('click', function () { go(active + 1); });
  focusBtn.addEventListener('click', function () { setFocus(!app.classList.contains('focus')); });
  exitBtn.addEventListener('click', function () { setFocus(false); });

  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t || !t.closest) return;
    var g = t.closest('[data-go]');
    if (g) { go(Number(g.getAttribute('data-go'))); return; }
    var a = t.closest('.screen a');
    if (a) e.preventDefault();
  });

  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t && t.closest && t.closest('input, textarea, select')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); go(active + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); go(active - 1); }
    else if (e.key === 'Escape' && app.classList.contains('focus')) { setFocus(false); }
  });

  if (window.ResizeObserver) { new ResizeObserver(fit).observe(track); }
  else { window.addEventListener('resize', fit); }

  fit();
  setActive(0);
})();

</script>
</body>
</html>
