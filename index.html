}

html { height: 100%; box-sizing: border-box; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { height: 100%; margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--font); overflow: hidden; overscroll-behavior: none; }
[hidden] { display: none !important; }
button { font-family: inherit; }
button:focus-visible { outline: none; box-shadow: var(--ring); }

.app { position: relative; height: 100%; overflow: hidden; }
.bar, .foot, .cover { word-break: keep-all; overflow-wrap: break-word; }

/* header */
.bar { position: absolute; z-index: 2; top: 0; left: 0; right: 0; padding-block: 8px 2px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); transition: opacity .25s ease, visibility .25s ease; }
.bar-in { width: 100%; max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.chip { flex-shrink: 0; font-size: 13px; line-height: 1.4; font-weight: 600; padding: 4px 10px; border-radius: 9999px; background: var(--surface-card); color: var(--ink); }
.chip[data-tone="teal"] { background: var(--teal); color: var(--on-teal); }
.chip[data-tone="lavender"] { background: var(--lavender); color: var(--on-brand); }

      if (el.hasAttribute('hidden') === on) el.toggleAttribute('hidden', !on);
    });
    var t = root.querySelector('.pv-theme'); if (t) t.textContent = THEMES[ci][0];
    var l = root.querySelector('.pv-layout-name'); if (l) l.textContent = LAYOUTS[li];
    each(root, '.sw', function (b) {
      var on = Number(b.getAttribute('data-i')) === ci;
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.style.boxShadow = on ? '0 0 0 2px #fffaf0, 0 0 0 4px #0a0a0a' : '0 0 0 0 transparent';
      var c = b.querySelector('.sw-check'); if (c) c.toggleAttribute('hidden', !on);
      var lab = b.parentNode.querySelector('.sw-label');
      if (lab) { lab.style.fontWeight = on ? '600' : '500'; lab.style.color = on ? '#0a0a0a' : '#6a6a6a'; }
    });
    each(root, '.lay', function (b) {
      var on = Number(b.getAttribute('data-i')) === li;
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.style.borderColor = on ? '#0a0a0a' : '#f5f0e0';
      var badge = b.querySelector('.lay-badge'); if (badge) badge.toggleAttribute('hidden', !on);
    });
  }

  function countUp(el) {
    var to = Number(el.getAttribute('data-to')) || 0;
    if (reduce) { el.textContent = String(to); return; }
    el.textContent = '0';
    var start = null, delay = 250, dur = 1400;
    function tick(t) {
      if (start === null) start = t;
      var p = Math.min(1, Math.max(0, (t - start - delay) / dur));
      el.textContent = String(Math.round(to * (1 - Math.pow(1 - p, 3))));
      if (p < 1) rafs.push(requestAnimationFrame(tick));
    }
    rafs.push(requestAnimationFrame(tick));
  }

  function stopExtras() {
    clearInterval(themeTimer); themeTimer = 0;
    rafs.forEach(function (id) { cancelAnimationFrame(id); }); rafs = [];
  }

  function startExtras(i) {
    var s = slides[i];
    each(s, '.count', countUp);
    var demo = s.querySelector('.theme-demo');
    if (demo && !reduce) {
      var step = 0;
      applyTheme(demo, 0);
      themeTimer = setInterval(function () { step = (step + 1) % 30; applyTheme(demo, step); }, 1800);
    }
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function updateChrome(i) {
    var m = META[i];
    chip.textContent = m.chip;
    chip.setAttribute('data-tone', m.tone);
    title.textContent = m.title;
    desc.textContent = m.desc;
    app.classList.toggle('on-cover', i === 0);
    counter.textContent = i === 0 ? '' : pad(i) + ' / ' + pad(N - 1);
    meter.style.width = (i / (N - 1) * 100) + '%';
    prevBtn.disabled = i === 0;
    nextBtn.disabled = i === N - 1;
  }

  function setActive(i) {
    if (i === active) return;
    var prev = active;
    active = i;
    slides.forEach(function (s, k) {
      var on = k === i;
      s.classList.toggle('is-live', on);
      if (on) { s.removeAttribute('inert'); s.removeAttribute('aria-hidden'); }
      else { s.setAttribute('inert', ''); s.setAttribute('aria-hidden', 'true'); }
    });
    stopExtras();
    if (prev >= 0) stale[prev] = true;
    delete stale[i];
    updateChrome(i);
    startExtras(i);
  }

  function flush() {
    Object.keys(stale).forEach(function (k) {
      var n = Number(k);
      if (n !== active) render(n);
    });
    stale = {};
  }

  function indexNow() {
    var w = Math.max(1, track.clientWidth);
    return Math.max(0, Math.min(N - 1, Math.round(track.scrollLeft / w)));
  }

  function go(i) {
    i = Math.max(0, Math.min(N - 1, i));
    track.scrollTo({ left: i * track.clientWidth, behavior: reduce ? 'auto' : 'smooth' });
  }

  function fit() {
    var rootStyle = document.documentElement.style;
    rootStyle.setProperty('--bar-h', bar.offsetHeight + 'px');
    rootStyle.setProperty('--foot-h', foot.offsetHeight + 'px');
    var w = track.clientWidth, h = track.clientHeight;
    var cs = window.getComputedStyle(slides[1] || slides[0]);
    var padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    var padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    var s = Math.max(0.3, Math.min((w - padX) / 390, (h - padY) / 844, 1));
    document.documentElement.style.setProperty('--s', s.toFixed(4));
    if (active >= 0) track.scrollLeft = active * w;
  }

  function setFocus(on) {
    app.classList.toggle('focus', on);
    focusBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    exitBtn.toggleAttribute('hidden', !on);
    fit();
    try { (on ? exitBtn : focusBtn).focus({ preventScroll: true }); } catch (e) {}
  }

  for (var i = 0; i < N; i++) render(i);

  track.addEventListener('scroll', function () {
    setActive(indexNow());
    clearTimeout(settleTimer);
    settleTimer = setTimeout(flush, 220);
  }, { passive: true });

  prevBtn.addEventListener('click', function () { go(active - 1); });
  nextBtn.addEventListener('click', function () { go(active + 1); });
  focusBtn.addEventListener('click', function () { setFocus(!app.classList.contains('focus')); });
  exitBtn.addEventListener('click', function () { setFocus(false); });

  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t || !t.closest) return;
    var g = t.closest('[data-go]');
    if (g) { go(Number(g.getAttribute('data-go'))); return; }
    var a = t.closest('.screen a');
    if (a) e.preventDefault();
  });

  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t && t.closest && t.closest('input, textarea, select')) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); go(active + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); go(active - 1); }
    else if (e.key === 'Escape' && app.classList.contains('focus')) { setFocus(false); }
  });

  if (window.ResizeObserver) {
    var ro = new ResizeObserver(fit);
    ro.observe(track); ro.observe(bar); ro.observe(foot);
  }
  else { window.addEventListener('resize', fit); }

  fit();
  setActive(0);
})();

</script>
</body>
</html>
